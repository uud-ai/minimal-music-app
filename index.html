<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Цвет системной строки — под светлую и тёмную тему телефона -->
    <meta name="theme-color" content="#FAF6EA" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F1D1B" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <title>Minimal Music</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Golos Text — основной текст (рисовался под кириллицу), Cormorant Garamond — название и заголовки -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="header-row">
                <h1>My Music</h1>
                <button id="account-btn" aria-label="Войти в аккаунт">Войти</button>
            </div>
            <div class="search-container" id="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
                <input type="search" id="search-input" placeholder="Песня или исполнитель" enterkeyhint="search" aria-label="Поиск на YouTube">
            </div>
        </header>

        <main id="player-container">
            <div id="pick-banner" class="hidden"></div>
            <div id="upload-bar" class="hidden">
                <label class="upload-btn">
                    <svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    Загрузить свои треки
                    <input type="file" id="upload-input" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" multiple hidden>
                </label>
                <span id="upload-status">MP3 и другие аудиофайлы, до 25 МБ каждый</span>
            </div>
            <div id="track-list">
                <p class="status">Введите название песни для поиска</p>
            </div>
            <button id="load-more-btn" class="hidden">Ещё</button>
            <section id="events-view" class="hidden"></section>
        </main>

        <div id="audio-wrapper" class="hidden">
            <div id="now-playing">
                <div class="np-top">
                    <!-- Обложка и название — кнопка: открывает плеер на весь экран -->
                    <button id="np-open" class="np-open" aria-label="Открыть плеер на весь экран">
                        <span id="np-cover" class="cover"></span>
                        <span class="np-info">
                            <strong id="np-title">—</strong>
                            <span id="np-artist"></span>
                        </span>
                    </button>
                    <div class="np-controls">
                        <button id="np-like" aria-label="Добавить в «Моя музыка»"></button>
                        <button id="np-playpause" aria-label="Играть"></button>
                    </div>
                </div>
                <div class="np-progress">
                    <span id="np-current">0:00</span>
                    <input type="range" id="np-seek" min="0" max="100" value="0" step="0.1">
                    <span id="np-duration">0:00</span>
                </div>
            </div>
            <!-- Свои файлы из облака играют здесь; треки YouTube — в плеере режима ведущего -->
            <audio id="file-player" preload="auto"></audio>
        </div>

        <!-- Плеер на весь экран: большая обложка, размытый фон из неё, перемотка и
             «предыдущий / пауза / следующий». Открывается нажатием на мини-плеер -->
        <div id="full-player" class="hidden" role="dialog" aria-modal="true" aria-label="Плеер">
            <div class="fp-backdrop" aria-hidden="true"><img id="fp-bg" alt=""></div>
            <div class="fp-inner">
                <div class="fp-top">
                    <button id="fp-close" class="fp-icon-btn" aria-label="Свернуть плеер"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9.5 6 6 6-6"/></svg></button>
                    <button id="fp-like" class="fp-icon-btn"></button>
                </div>
                <div class="fp-stage">
                    <div id="fp-cover" class="fp-cover"></div>
                </div>
                <div class="fp-meta">
                    <strong id="fp-title">—</strong>
                    <button id="fp-artist" class="fp-artist"></button>
                </div>
                <div class="fp-progress">
                    <input type="range" id="fp-seek" min="0" max="100" value="0" step="0.1" aria-label="Перемотка">
                    <div class="fp-times"><span id="fp-current">0:00</span><span id="fp-duration">0:00</span></div>
                </div>
                <div class="fp-controls">
                    <button id="fp-prev" class="fp-icon-btn" aria-label="Предыдущий трек"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 18.5v-13L8.5 12z" fill="currentColor"/><path d="M5.5 5.5v13"/></svg></button>
                    <button id="fp-playpause" aria-label="Играть"></button>
                    <button id="fp-next" class="fp-icon-btn" aria-label="Следующий трек"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5.5v13l9.5-6.5z" fill="currentColor"/><path d="M18.5 5.5v13"/></svg></button>
                </div>
            </div>
        </div>

        <!-- Режим ведущего. Закрытый оверлей не скрыт через display:none, а сдвинут за
             край экрана: внутри живёт YouTube-плеер, и он должен продолжать играть -->
        <div id="show-mode" inert>
            <div class="show-top">
                <div class="show-heading">
                    <strong id="show-event-title"></strong>
                    <span id="show-clock"></span>
                </div>
                <button id="show-requests" class="hidden" aria-label="Заказы гостей"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg></button>
                <button id="show-close" aria-label="Закрыть режим ведущего"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
            </div>
            <div id="show-video"><div id="yt-player"></div></div>
            <div class="show-now">
                <span class="show-label">Сейчас</span>
                <strong id="show-block-title">Ничего не запущено</strong>
                <span id="show-track-title"></span>
            </div>
            <!-- Панель идущей игры: «Замри», «Угадай мелодию», бинго -->
            <div id="show-game"></div>
            <div class="show-controls">
                <button id="show-stop"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>Стоп</button>
                <button id="show-playpause"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5v13a.6.6 0 0 0 .9.5l10.2-6.5a.6.6 0 0 0 0-1L8.9 5a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg>Играть</button>
                <button id="show-next">Следующий блок<svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5.5v13l9.5-6.5z" fill="currentColor"/><path d="M18.5 5.5v13"/></svg></button>
            </div>
            <ol id="show-blocks"></ol>
            <div id="show-requests-panel" class="hidden"></div>
            <div id="freeze-overlay" class="hidden">
                <p class="freeze-title">ЗАМРИ!</p>
                <p class="freeze-emoji"><svg class="freeze-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/></svg></p>
                <button class="freeze-btn" data-game="resume"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5v13a.6.6 0 0 0 .9.5l10.2-6.5a.6.6 0 0 0 0-1L8.9 5a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg>Музыка!</button>
            </div>
        </div>

        <!-- QR-код для гостей на весь экран — показать залу или вывести на проектор -->
        <div id="qr-fullscreen" class="hidden"></div>

        <!-- Вход необязателен: без него всё работает на этом устройстве -->
        <div id="account-sheet" class="hidden">
            <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="account-title"></div>
        </div>

        <nav class="bottom-nav">
            <button id="nav-search" class="active">
                <svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
                Поиск
            </button>
            <button id="nav-library">
                <svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
                Моя музыка
            </button>
            <button id="nav-events">
                <svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/><path d="m12 12.6.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2-1.45-1.4 2-.3z" fill="currentColor" stroke="none"/></svg>
                Мероприятия
            </button>
        </nav>
    </div>
    
    <!-- Страница гостя (?guest=<id>): заказ песни по QR-коду вместо приложения -->
    <main id="guest-view" class="hidden"></main>

    <!-- Карточки бинго для печати: видны только при печати -->
    <div id="print-area"></div>

    <script type="module" src="main.js"></script>
</body>
</html>
